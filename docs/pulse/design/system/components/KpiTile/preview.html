<style>.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}@media (max-width:700px){.g{grid-template-columns:1fr}}.k{display:flex;flex-direction:column;gap:24px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:border-color .12s}.k:hover{border-color:var(--border-strong)}.k.w{border-color:var(--warning);background:radial-gradient(ellipse at top right,var(--warning-surface),var(--surface) 60%)}.h{display:flex;align-items:center;gap:8px;font:400 11px/16px "DM Mono",monospace;letter-spacing:.06em;color:var(--text-muted)}.h svg{width:16px;height:16px;color:var(--primary-text)}.w .h svg{color:var(--warning)}.v{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.v b{font:300 36px/40px "DM Mono",monospace;letter-spacing:-.02em;color:var(--text-strong);font-variant-numeric:tabular-nums}.w .v b{color:var(--warning-text)}.v span{font-size:16px;line-height:22px;font-weight:500;color:var(--text-muted)}.f{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px}.f svg{width:14px;height:14px}.bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}.bar i{display:block;height:100%;width:57%;border-radius:999px;background:var(--primary-hover);box-shadow:0 0 10px 0 var(--primary-hover)}</style>
