<!-- @dsCard group="Layout" height=230 subtitle="Card with header, overline count and action; default and critical" -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--page);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:14px;line-height:20px}*{box-sizing:border-box}</style>
<style>.row{display:flex;gap:20px;flex-wrap:wrap}.card{flex:1 1 280px;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:border-color .12s}.card:hover{border-color:var(--border-strong)}.card.crit{border-color:var(--danger-border);box-shadow:var(--glow-danger)}.h{display:flex;align-items:center;gap:12px;padding:var(--space-6) var(--space-6) 0}.t{margin:0;font-size:16px;line-height:22px;font-weight:500;letter-spacing:-.01em;color:var(--text-strong)}.o{font:400 11px/16px "DM Mono",monospace;letter-spacing:.06em;color:var(--text-muted)}.sp{flex:1}.a{font-weight:500;color:var(--primary-text)}.c{padding:16px var(--space-6) var(--space-6);color:var(--text-muted)}</style>
<div class="row">
<div class="card"><div class="h"><h2 class="t">Salle B</h2><span class="o">4 SERVEURS</span><span class="sp"></span><span class="a">Ouvrir →</span></div><div class="c">Les salles regroupent les serveurs et leurs onduleurs. Les changements s'appliquent à chaque serveur de la salle.</div></div>
<div class="card crit"><div class="h"><h2 class="t">UPS-B2</h2><span class="o" style="color:var(--danger-text)">SUR BATTERIE</span></div><div class="c">esx-03 et esx-04 tiennent sur l'onduleur depuis 6 min.</div></div>
</div>
