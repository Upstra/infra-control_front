<!-- @dsCard group="Controls" height=120 subtitle="On, off, disabled; click to toggle" -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--page);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:14px;line-height:20px}*{box-sizing:border-box}</style>
<style>.row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}.sw{position:relative;display:inline-flex;width:44px;height:24px;border-radius:var(--radius-full);background:var(--toggle-off);border:0;padding:0;cursor:pointer;transition:background .18s}.sw[aria-checked="true"]{background:var(--primary);box-shadow:0 0 16px -4px rgba(59,130,246,.8)}.sw:disabled{opacity:.45;cursor:default}.sw i{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:var(--radius-full);background:#fff;transition:left .18s cubic-bezier(.2,.8,.2,1)}.sw[aria-checked="true"] i{left:24px}.sw:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px}label{display:flex;gap:10px;align-items:center}@media (prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}</style>
<div class="row"><label><button class="sw" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"><i></i></button>Animations</label><label><button class="sw" role="switch" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"><i></i></button>Son des alertes</label><label><button class="sw" role="switch" aria-checked="false" disabled><i></i></button>Indisponible</label></div>
