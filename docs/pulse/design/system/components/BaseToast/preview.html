<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--page);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:14px;line-height:20px}*{box-sizing:border-box}</style>
<style>.t{display:flex;align-items:center;gap:12px;min-width:260px;width:max-content;margin-bottom:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);font-weight:500;color:var(--text-strong)}.t i{width:8px;height:8px;border-radius:var(--radius-full)}</style>
<div class="t"><i style="background:var(--status-success);box-shadow:0 0 10px 1px rgba(34,197,94,.6)"></i>Serveur démarré</div><div class="t"><i style="background:var(--status-error);box-shadow:0 0 10px 1px rgba(239,68,68,.6)"></i>Échec de l'arrêt</div><div class="t"><i style="background:var(--status-info);box-shadow:0 0 10px 1px rgba(59,130,246,.6)"></i>Synchronisation en cours</div>
