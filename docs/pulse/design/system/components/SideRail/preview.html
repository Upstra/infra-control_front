<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--page);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:14px;line-height:20px}*{box-sizing:border-box}</style>
<style>
.stage{position:relative;height:520px;display:flex}
.wrap{flex:0 0 76px;position:relative;z-index:2}
.rail{position:absolute;inset:0 auto 0 0;width:76px;display:flex;flex-direction:column;gap:6px;padding:20px 16px;background:var(--page);border-right:1px solid var(--surface-raised);overflow:hidden;transition:width .18s cubic-bezier(.2,.8,.2,1),background .18s,box-shadow .18s}
.rail:hover,.rail:focus-within{width:248px;background:var(--surface);border-right-color:var(--border);box-shadow:24px 0 48px -16px rgba(0,0,0,.75);transition:width .24s cubic-bezier(.2,.8,.2,1) .1s,background .18s .1s,box-shadow .18s .1s}
.lbl{opacity:0;transform:translateX(-6px);white-space:nowrap;transition:opacity .12s,transform .12s}
.rail:hover .lbl,.rail:focus-within .lbl{opacity:1;transform:none;transition:opacity .18s .16s,transform .18s .16s}
.it{flex:none;display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:var(--radius-md);color:var(--text-muted);text-decoration:none;font-weight:500;transition:background .12s,color .12s}
.it:hover{background:var(--surface-raised);color:var(--text-strong)}
.it.on{background:var(--surface-raised);color:var(--text-strong);box-shadow:inset 2px 0 0 0 var(--primary-hover)}
.it:focus-visible{outline:2px solid var(--primary-text);outline-offset:-2px}
.it svg{flex:none;width:20px;height:20px}
.ct{margin-left:auto;font:400 11px/16px "DM Mono",monospace;color:var(--text-muted)}
.crit{margin-left:auto;padding:1px 8px;border-radius:999px;background:var(--danger-solid);color:var(--on-primary);font:400 10px/16px "DM Mono",monospace;letter-spacing:.06em}
.dot{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:999px;background:var(--danger);border:2px solid var(--page);box-shadow:0 0 8px 1px rgba(239,68,68,.8)}
.content{flex:1;padding:32px;color:var(--text-muted)}
.content b{display:block;font-size:22px;line-height:28px;font-weight:500;color:var(--text-strong);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.rail,.lbl{transition:none}}
</style>

<a href="#" class="it on" aria-current="page"><span style="position:relative;display:flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M9 9.5 7 12h4l-2 2.5"/></svg><span class="dot"></span></span><span class="lbl">Onduleurs</span><span class="lbl crit">1 CRIT</span></a>

</nav></div>
